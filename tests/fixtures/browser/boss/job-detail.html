<!doctype html>
<html>
  <head><title>BOSS 职位详情夹具</title></head>
  <body>
    <div data-testid="user-avatar">已登录</div>
    <main data-testid="job-detail" data-job-id="boss-job-1">
      <h1 data-testid="job-title">高级 Python 后端工程师</h1>
      <span data-testid="company-name">示例科技</span>
      <span data-testid="company-industry">企业服务</span>
      <span data-testid="job-location">上海</span>
      <span data-testid="work-mode">支持远程</span>
      <span data-testid="salary">35K-45K</span>
      <span data-testid="recruiter-name">张招聘</span>
      <section data-testid="job-description">Python、FastAPI、PostgreSQL，5 年后端经验。</section>
      <button data-testid="start-chat" type="button" onclick="openChat()">立即沟通</button>
    </main>
    <section data-testid="chat-panel" d-c="boss-chat-new" hidden>
      <textarea data-testid="message-composer"></textarea>
      <button data-testid="send-message" type="button" onclick="sendMessage()">发送</button>
      <div id="messages"></div>
    </section>
    <section data-testid="greeting-dialog" hidden>
      <span>已发送</span>
      <p data-testid="greeting-message"></p>
    </section>
    <script>
      function openChat() {
        document.querySelector('[data-testid="chat-panel"]').hidden = false;
        const dialog = document.querySelector('[data-testid="greeting-dialog"]');
        dialog.hidden = false;
        document.querySelector('[data-testid="greeting-message"]').textContent =
          '您好，我对这个岗位很感兴趣，我的经历与岗位要求有一定匹配，希望能进一步沟通了解，谢谢。';
      }
      function sendMessage() {
        const composer = document.querySelector('[data-testid="message-composer"]');
        const message = document.createElement('div');
        message.dataset.testid = 'message-item';
        message.dataset.direction = 'outbound';
        message.textContent = composer.value;
        document.querySelector('#messages').appendChild(message);
      }
    </script>
  </body>
</html>
